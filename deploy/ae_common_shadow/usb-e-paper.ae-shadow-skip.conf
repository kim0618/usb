# /etc/systemd/system/usb-e-paper.service.d/ae-shadow-skip.conf
# From the armed first paper session on (ACTIVE_FROM), usb-e-paper does not start: the common producer owns
# the app key, A's cut runs from snapshot_0915 and E's paper from snapshot_0924. Before that date, or once
# ACTIVE_FROM is removed (rollback), this condition passes and usb-e-paper runs exactly as it does now.
# Rollback: rm this file && systemctl daemon-reload
[Service]
ExecCondition=/bin/sh -c 'f=/root/usb_runtime/ae_common_producer/ACTIVE_FROM; ! { test -f "$f" && test "$(TZ=America/New_York date +%%Y%%m%%d)" -ge "$(tr -d - < "$f")"; }'
