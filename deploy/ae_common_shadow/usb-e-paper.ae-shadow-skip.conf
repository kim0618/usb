# /etc/systemd/system/usb-e-paper.service.d/ae-shadow-skip.conf
# On the armed shadow session only, usb-e-paper does not start: the common producer owns the app key
# that morning and A's cut runs from its snapshot. Every other day this condition passes and
# usb-e-paper runs exactly as it does now (with r1-paper-off.conf still in force).
# Rollback: rm this file && systemctl daemon-reload
[Service]
ExecCondition=/bin/sh -c '! { test -f /root/usb_runtime/ae_common_producer/ACTIVE_SESSION && test "$(cat /root/usb_runtime/ae_common_producer/ACTIVE_SESSION)" = "$(TZ=America/New_York date +%%F)"; }'
